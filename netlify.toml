# Netlify configuration for Qi-Coexistence

[build]
  # npm install 只為了 Netlify Functions 的依賴（pdf-text 需要 unpdf／pdf.js）。
  # 前端仍是單一 index.html，不經任何打包——這個指令不會動到它。
  # 版本由 package-lock.json 鎖死；Node 版本與 healsmap 一致（那站已長期使用同一組設定）。
  command = "npm install"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Netlify Functions（Node 執行環境，秒級 CPU）。路由寫在各檔案自己的
# `export const config = { path }`，不必在這裡逐一列出：
#   /api/pdf-text  PDF 內文抽取（pdf-text.mjs）
#   /api/tbn       TBN 臺灣生物多樣性網絡物種查詢（tbn.mjs）
#
# 這兩件事放 Function 而不是 Edge Function，都是同一個原因：
# Edge 每次請求只有 50 ms CPU。pdf.js 解析一份報告要 100 ms 上下（實測曾衝到 73 ms，
# 超支會中止整個請求）；TBN 要 JSON.parse 約 3 MB、彙整兩千多筆各 64 欄的紀錄，同樣在天花板上。
[functions]
  directory = "netlify/functions"

# Cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Pretty URLs
[[redirects]]
  from = "/app"
  to = "/"
  status = 200

# Claude API 代理（金鑰存於環境變數，瀏覽器看不到）
# 需在 Netlify Dashboard 設定環境變數：ANTHROPIC_API_KEY、QI_PASSCODE
[[edge_functions]]
  path = "/api/analyze"
  function = "analyze"

# 參考文獻真實性查核（doi.org／Crossref／OpenAlex／直接開啟網址；不需金鑰）；mode: 'abstract' 取得來源摘要供引用句比對
# 選填環境變數：VERIFY_MAILTO（Crossref／OpenAlex 禮貌池聯絡信箱，可提高查詢額度）
[[edge_functions]]
  path = "/api/verify"
  function = "verify"

# iNaturalist 卡片的保育類與特有種標示（代查臺灣物種名錄 TaiCOL；不需金鑰）
[[edge_functions]]
  path = "/api/taxon-status"
  function = "taxon-status"

# OSM 環境脈絡代查（可用帶金鑰的 overpass.ch、送出可識別的 User-Agent、共用快取；不需通行碼）
# 選填環境變數：OVERPASS_API_KEY（只填金鑰本身，建議）或 OVERPASS_ENDPOINT（完整 interpreter 網址，
#                例如 https://api.overpass.ch/v1/k7Qm2xR9vTb4/interpreter，該值為假的範例、不要留角括號；
#                               未設定時只用公用伺服器）
[[edge_functions]]
  path = "/api/osm"
  function = "osm"

# 可用模型與建議模型（由 Anthropic Models API 取得，快取 6 小時）
# 選填環境變數：RECOMMENDED_MODEL（指定建議模型，例如 claude-opus-5-5；須是目前可用的模型）
[[edge_functions]]
  path = "/api/models"
  function = "models"
