# Netlify configuration for Qi-Coexistence

[build]
  publish = "."

# Cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Pretty URLs
[[redirects]]
  from = "/app"
  to = "/"
  status = 200

# Claude API 代理（金鑰存於環境變數，瀏覽器看不到）
# 需在 Netlify Dashboard 設定環境變數：ANTHROPIC_API_KEY、QI_PASSCODE
[[edge_functions]]
  path = "/api/analyze"
  function = "analyze"

# 參考文獻真實性查核（doi.org／Crossref／OpenAlex／直接開啟網址；不需金鑰）
# 選填環境變數：VERIFY_MAILTO（Crossref／OpenAlex 禮貌池聯絡信箱，可提高查詢額度）
[[edge_functions]]
  path = "/api/verify"
  function = "verify"

# 可用模型與建議模型（由 Anthropic Models API 取得，快取 6 小時）
# 選填環境變數：RECOMMENDED_MODEL（指定建議模型，例如 claude-opus-5-5；須是目前可用的模型）
[[edge_functions]]
  path = "/api/models"
  function = "models"
